services:
  - type: web
    name: haul-copilot-api
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install --upgrade pip && pip install -e ".[lite]"
    startCommand: uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GOOGLE_API_KEY
        sync: false
      - key: FMCSA_WEB_KEY
        sync: false
      - key: ORACLE_MODEL
        value: gemini-flash-latest
      - key: AGENT_MODEL
        value: gemini-flash-lite-latest
      - key: CHROMA_PERSIST_DIR
        value: /opt/render/project/src/data/chroma
      - key: API_HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: INFO
      - key: TRACE_ENABLED
        value: "true"
      - key: TRACE_DIR
        value: /opt/render/project/src/evals/results
